<!-- Producto principal -->
<div *ngIf="!loading && product" class="max-w-5xl mx-auto bg-white rounded-2xl shadow-xl p-6 mt-10">
  <h2 class="text-3xl font-bold text-green-800 mb-4">{{ product.nombre }}</h2>
  <img [src]="product.imagen_url || 'mandarinas.jpg'" 
       alt="{{ product.nombre }}"
       class="w-full h-80 object-cover rounded-lg shadow-md transition-transform duration-500 hover:scale-105 mb-6">
  <p class="text-gray-600 mb-4">{{ product.descripcion }}</p>
  <p class="text-sm text-gray-500">Categoría: {{ product.categoria_id }}</p>
  <p class="text-sm text-gray-500 mb-6">Temporada: {{ product.temporada_id }}</p>
</div>

<!-- Carrusel de recomendados -->
<div *ngIf="recommendedProducts.length > 0" class="max-w-6xl mx-auto mt-12">
  <h3 class="text-2xl font-semibold text-gray-800 mb-4">Productos recomendados</h3>
  
  <div class="flex space-x-4 overflow-x-auto pb-4 scrollbar-hide">
    <div *ngFor="let rec of recommendedProducts"
         class="min-w-[220px] bg-white rounded-lg shadow-md cursor-pointer flex-shrink-0 hover:shadow-xl transition-shadow duration-300"
         (click)="goToProduct(rec.id)">
      <img [src]="rec.imagen_url || 'mandarinas.jpg'" 
           alt="{{ rec.nombre }}"
           class="w-full h-40 object-cover rounded-t-lg">
      <div class="p-4">
        <h4 class="font-bold text-gray-800">{{ rec.nombre }}</h4>
        <p class="text-sm text-gray-600 truncate">{{ rec.descripcion }}</p>
      </div>
    </div>
  </div>
</div>
