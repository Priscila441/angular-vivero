<div *ngIf="loading" class="flex justify-center items-center h-40">
  <span class="text-green-700 font-semibold text-lg animate-pulse">Loading products...</span>
</div>

<div *ngIf="!loading && errorMessage" class="flex justify-center items-center h-40">
  <span class="text-red-600 font-medium text-lg">{{ errorMessage }}</span>
</div>

<div *ngIf="!loading && products.length > 0" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 p-4">
  <div *ngFor="let product of products"
       class="bg-white rounded-2xl shadow-lg overflow-hidden cursor-pointer hover:shadow-2xl hover:scale-105 transition-transform duration-300"
       (click)="goToProduct(product.id)">
    
    <!-- Imagen del producto -->
    <div class="w-full h-40 bg-green-50 flex items-center justify-center overflow-hidden">
      <img src="mandarinas.jpg" 
           alt="imagen del producto"
           class="w-full h-full object-cover transition-transform duration-500 hover:scale-110" />
      <!-- <img [src]="product.imagen_url" alt="{{product.nombre}}" class="w-full h-full object-cover transition-transform duration-500 hover:scale-110" /> -->
    </div>
    
    <!-- Contenido de la card -->
    <div class="p-4">
      <h3 class="font-bold text-green-800 text-lg mb-1">{{ product.nombre }}</h3>
      <p class="text-green-700 text-sm">{{ product.descripcion }}</p>
    </div>
    
  </div>
</div>
