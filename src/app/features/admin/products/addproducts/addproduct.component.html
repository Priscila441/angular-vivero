<!-- Header contextual para proyección -->
<div admin-header class="sticky top-0 z-10 bg-[#e8f2ec] p-6 pb-0">
  <div class="flex items-center gap-4 justify-start">
    <!-- Botón de vuelta -->
    <a routerLink="/admin/products" class="flex items-center gap-2 text-[#0e1a13] hover:text-[#51946c] transition-colors">
      <span class="material-symbols-outlined text-xl">arrow_back</span>
      <span class="text-sm font-medium">Volver</span>
    </a>
    <!-- Separador -->
    <div class="w-px h-6 bg-[#d1e6d9]"></div>
    <!-- Breadcrumb -->
    <nav class="flex items-center gap-2 text-sm">
      <span class="text-[#51946c]">Panel</span>
      <span class="material-symbols-outlined text-sm text-[#94b5a3]">chevron_right</span>
      <span class="text-[#51946c]">Lista de Productos</span>
      <span class="material-symbols-outlined text-sm text-[#94b5a3]">chevron_right</span>
      <span class="text-[#0e1a13] font-medium">Agregar Producto</span>
    </nav>
  </div>
</div>
<!-- Contenido Principal -->
<div class="max-w-2xl mx-auto h-full flex flex-col mt-18 px-4 sm:px-6 md:px-8">
      <div class="mb-6">
        <h1 class="text-[#0e1a13] text-lg font-bold leading-tight tracking-[-0.015em]">Agregar Nueva Planta</h1>
        <p class="text-[#51946c] mt-2 text-sm font-medium leading-normal">Completa los detalles a continuación para agregar una nueva planta al catálogo del vivero.</p>
      </div>
      
      <form class="flex-1 flex flex-col space-y-4">
        <div>
          <label class="block text-sm font-medium leading-normal text-[#0e1a13] pb-2" for="plant-name">Nombre de la Planta</label>
          <input class="form-input block w-full rounded-lg border-[#d1e6d9] bg-white focus:ring-2 focus:ring-[#38e07b] focus:border-[#38e07b] h-10 px-4 text-sm placeholder:text-[#94b5a3]" id="plant-name" placeholder="Ej: Mandarina Criolla" type="text"/>
        </div>
        
        <div>
          <label class="block text-sm font-medium leading-normal text-[#0e1a13] pb-2" for="description">Descripción</label>
          <textarea class="form-textarea block w-full rounded-lg border-[#d1e6d9] bg-white focus:ring-2 focus:ring-[#38e07b] focus:border-[#38e07b] min-h-24 p-4 text-sm placeholder:text-[#94b5a3]" id="description" placeholder="Proporciona una breve descripción de la planta."></textarea>
        </div>
        
        <div>
          <label class="block text-sm font-medium leading-normal text-[#0e1a13] pb-2" for="image-url">Imágenes</label>
          <input class="form-input block w-full rounded-lg border-[#d1e6d9] bg-white focus:ring-2 focus:ring-[#38e07b] focus:border-[#38e07b] h-10 px-4 text-sm placeholder:text-[#94b5a3]" id="image-url" placeholder="mandarina.jpg" type="url"/>
        </div>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium leading-normal text-[#0e1a13] pb-2" for="category">Categoría</label>
              <select class="form-select block w-full rounded-lg border-[#d1e6d9] bg-white focus:ring-2 focus:ring-black focus:border-black[#38e07b] h-10 px-4 text-sm text-[#0e1a13]" id="category">
              <option disabled="" selected="">Seleccionar Categoría</option>
              <option>Mandarinas</option>
              <option>Uvas</option>
              <option>Tunas</option>
              <option>Higos</option>
            </select>
          </div>
          
          <div>
            <label class="block text-sm font-medium leading-normal text-[#0e1a13] pb-2" for="season">Temporada</label>
              <select class="form-select block w-full rounded-lg border-[#d1e6d9] bg-white focus:ring-2 focus:ring-black focus:border-[#38e07b] h-10 px-4 text-sm text-[#0e1a13]" id="season">
              <option disabled="" selected="">Seleccionar Temporada</option>
              <option>Primavera</option>
              <option>Verano</option>
              <option>Otoño</option>
              <option>Invierno</option>
              <option>Todo el año</option>
            </select>
          </div>
        </div>
        
        <div class="flex flex-col sm:flex-row justify-end pt-2 space-y-2 sm:space-y-0 sm:space-x-4">
          <button class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 px-6 bg-white text-[#0e1a13] text-sm font-bold leading-normal tracking-wide border border-[#d1e6d9] hover:bg-[#e8f2ec] transition-colors" type="button">
            <span class="truncate">Cancelar</span>
          </button>
          <button class="flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 px-6 bg-[#e8f2ec] text-[#0e1a13] text-sm font-bold leading-normal tracking-wide border border-black hover:bg-[#7cc298] transition-colors" type="submit">
            <span class="truncate">Agregar Planta</span>
          </button>
        </div>
      </form>
</div>
